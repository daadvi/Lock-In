name: Gerar APK instalável

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A imagem ubuntu-latest NÃO expõe sdkmanager no PATH e a action
      # android-actions/setup-android@v3 está deprecada/quebrada no runner
      # Node 24, então instalamos as cmdline-tools oficiais manualmente.
      - name: Instalar SDK exigido pelo projeto
        run: |
          curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # GITHUB_PATH só vale nos passos seguintes: neste passo o sdkmanager
          # ainda não está no PATH, então chamamos pelo caminho completo.
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.0.0"
          # Deixa o sdkmanager no PATH para os passos seguintes.
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Segurança extra para o Gradle achar o SDK.
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # O repositório não armazena uma chave privada. Esta chave de desenvolvimento
      # torna o APK instalável para testes, mas é recriada em cada execução.
      - name: Criar chave de desenvolvimento temporária
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Preparar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Testar, analisar e montar APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Lock-In-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar relatórios se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lock-In-relatorios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
