name: Gerar APK instalável

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A imagem ubuntu-latest já traz o Android SDK em /usr/local/lib/android/sdk
      # (cmdline-tools "latest"). A ação android-actions/setup-android@v3 está
      # deprecada e falha no runner atual, então instalamos direto via sdkmanager.
      - name: Instalar SDK exigido pelo projeto
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # O repositório não armazena uma chave privada. Esta chave de desenvolvimento
      # torna o APK instalável para testes, mas é recriada em cada execução.
      - name: Criar chave de desenvolvimento temporária
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Preparar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Testar, analisar e montar APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Lock-In-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar relatórios se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lock-In-relatorios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
